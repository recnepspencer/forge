name: Setup WORTH UI Rust
description: Install the pinned Worth UI toolchain and ephemeral-runner compiler cache.

runs:
  using: composite
  steps:
    - name: Install pinned WORTH UI Rust toolchain
      uses: dtolnay/rust-toolchain@1.94.0
      with:
        components: clippy, rustfmt

    - name: Cache Cargo sources
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-worth-ui-cargo-home-1.94.0-${{ hashFiles('workspaces/worth-ui/Cargo.lock', 'workspaces/worth-ui/crates/worth-ui-certification/tests/fixtures/compile_contracts/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-worth-ui-cargo-home-1.94.0-

    - name: Install compiler object cache
      uses: mozilla-actions/sccache-action@v0.0.10
      with:
        version: "v0.15.0"

    - name: Configure compiler cache
      shell: bash
      run: |
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
