name: WORTH CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

env:
  CARGO_TERM_COLOR: always
  SIGNAL_SNAPSHOT_DIR: ${{ runner.temp }}/signal-semantic-snapshots
  SIGNAL_DETERMINISM_DIR: ${{ runner.temp }}/signal-determinism-cert
  SIGNAL_PERF_REPORT_PATH: ${{ runner.temp }}/signal-parallel-perf-report.json

jobs:
  build-and-test:
    name: Build, Test, Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Delivery guards
        run: python3 scripts/ci/check_delivery_guards.py

      - name: Worth UI Phase 10 authority boundary guard
        run: python3 scripts/ci/check_worth_ui_phase_10_authority_boundaries.py

      - name: Determinism guards
        run: python3 scripts/ci/check_determinism_guards.py

      - name: Signal runtime guards
        run: bash scripts/ci/check_signal_runtime_guards.sh

      - name: Workspace Rust line caps
        run: bash scripts/ci/check_workspace_rust_line_caps.sh

      - name: Constitution
        shell: pwsh
        run: pwsh -File scripts/check-constitution.ps1 --format json

      - name: Road 1 adoption certification corpus
        run: cargo test --manifest-path cad/workspaces/worth-certification/Cargo.toml -p worth-cert-adoption --test compile_fail

      - name: Build workspace
        run: cargo build --workspace

      - name: worth-signal parallel semantic check
        run: cargo check -p worth-signal --features parallel

      - name: worth-signal core profile gate
        run: bash scripts/ci/check_signal_core_profiles.sh

      - name: worth-signal adversarial parallel lane
        run: cargo test -p worth-signal --lib --features parallel adversarial_parallel -- --nocapture

      - name: worth-signal diagnostics lane
        run: cargo test -p worth-signal --lib --features parallel diagnostics -- --nocapture

      - name: worth-signal harness replay lane
        run: cargo test -p worth-signal --lib --features parallel harness_adapter -- --nocapture

      - name: worth-signal phase 5 contract lane
        run: bash scripts/ci/check_signal_phase5_contracts.sh

      - name: worth-signal adversarial workflow lane
        run: bash scripts/ci/check_signal_adversarial_workflows.sh

      - name: worth-signal transaction adversarial lane
        run: cargo test -p worth-signal --lib --features parallel transaction_ -- --nocapture

      - name: worth-signal failure matrix gate
        run: bash scripts/ci/check_signal_failure_matrix.sh

      - name: worth-signal contract matrix gate
        run: bash scripts/ci/check_signal_contract_matrix.sh

      - name: worth-signal resource bounds gate
        run: bash scripts/ci/check_signal_resource_bounds.sh

      - name: worth-signal semantic snapshot diff lane
        run: bash scripts/ci/check_signal_semantic_snapshots.sh "${SIGNAL_SNAPSHOT_DIR}"

      - name: Run tests
        run: cargo test --workspace

      - name: Upload worth-signal semantic snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worth-signal-semantic-snapshots
          path: ${{ env.SIGNAL_SNAPSHOT_DIR }}
          if-no-files-found: ignore

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace -- -D warnings

      - name: Benchmarks compile
        run: cargo bench --workspace --no-run

  miri:
    name: Miri (worth-math)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly + miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-

      - name: Run miri on worth-math
        run: cargo +nightly miri test -p worth-math

  worth-store-proof:
    name: WORTH Store ${{ matrix.partition }} (${{ matrix.os }}, shard ${{ matrix.shard_index }}/${{ matrix.shard_count }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, partition: owner-unit, shard_index: 0, shard_count: 0 }
          - { os: ubuntu-latest, partition: scenario-certification, shard_index: 0, shard_count: 2 }
          - { os: ubuntu-latest, partition: scenario-certification, shard_index: 1, shard_count: 2 }
          - { os: windows-latest, partition: scenario-certification, shard_index: 0, shard_count: 2 }
          - { os: windows-latest, partition: scenario-certification, shard_index: 1, shard_count: 2 }
          - { os: ubuntu-latest, partition: ui-dependency, shard_index: 0, shard_count: 0 }
          - { os: windows-latest, partition: ui-dependency, shard_index: 0, shard_count: 0 }
          - { os: ubuntu-latest, partition: fresh-process, shard_index: 0, shard_count: 0 }
          - { os: windows-latest, partition: fresh-process, shard_index: 0, shard_count: 0 }
          - { os: ubuntu-latest, partition: structural-preflight, shard_index: 0, shard_count: 0 }
          - { os: ubuntu-latest, partition: formal-external, shard_index: 0, shard_count: 0 }

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Record resolved Rust toolchain identity
        shell: pwsh
        run: rustc -Vv | Set-Content -NoNewline .ci-rustc-identity

      - name: Cache WORTH Store registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-worth-store-${{ matrix.partition }}-ci-test-
            features-${{ hashFiles('workspaces/worth-store/test-control/feature-semantic-authority.json', 'workspaces/worth-store/**/Cargo.toml') }}-
            toolchain-${{ hashFiles('.ci-rustc-identity') }}-
            config-${{ hashFiles('workspaces/worth-store/.cargo/config.toml', 'workspaces/worth-store/Cargo.toml') }}-
            lock-${{ hashFiles('workspaces/worth-store/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-worth-store-${{ matrix.partition }}-ci-test-

      - name: Install pinned TLC runtime
        if: matrix.partition == 'formal-external'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Execute unsharded proof partition
        if: matrix.shard_count == 0
        working-directory: workspaces/worth-store
        run: cargo store-ci --partition ${{ matrix.partition }}

      - name: Execute proof partition shard
        if: matrix.shard_count > 0
        working-directory: workspaces/worth-store
        run: >-
          cargo store-ci --partition ${{ matrix.partition }}
          --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}

      - name: Run release-scale backup lane
        if: matrix.partition == 'owner-unit' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: >-
          cargo test --manifest-path workspaces/worth-store/Cargo.toml
          -p worth-store-operations --lib
          phase_1_6_tests::release_scale_backup::two_gib_owner_bundle_stays_bounded_through_materialization_and_independent_verification
          -- --ignored --exact --nocapture --test-threads=1

      - name: Upload source-bound partition evidence
        uses: actions/upload-artifact@v4
        with:
          name: worth-store-proof-${{ runner.os }}-${{ matrix.partition }}-${{ matrix.shard_index }}
          path: workspaces/worth-store/.store-proof/evidence/ci/partitions
          if-no-files-found: error

  worth-store-lint:
    name: WORTH Store lint (${{ matrix.responsibility }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { responsibility: test-control, packages: '-p store-proof-control -p worth-store-test-support --all-targets' }
          - { responsibility: certification, packages: '-p worth-store-certification -p worth-store-formal-models --all-targets' }
          - { responsibility: process-probes, packages: '-p worth-store-physical-certification --all-targets' }
          - { responsibility: production-owners, packages: '--workspace --lib --bins' }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lint responsibility targets
        working-directory: workspaces/worth-store
        run: cargo clippy ${{ matrix.packages }} -- -D warnings

  worth-store-certification-aggregate:
    name: WORTH Store source-bound certification aggregate
    runs-on: ubuntu-latest
    needs: worth-store-proof
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: worth-store-proof-*
          path: .store-ci-evidence
          merge-multiple: true
      - name: Aggregate required proof lanes
        working-directory: workspaces/worth-store
        run: cargo run -p store-proof-control -- ci-aggregate --evidence-root ../../.store-ci-evidence
      - name: Upload certification aggregate
        uses: actions/upload-artifact@v4
        with:
          name: worth-store-certification-aggregate
          path: workspaces/worth-store/.store-proof/evidence/ci/aggregates
          if-no-files-found: error

  signal-perf:
    name: Signal Performance Lane
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-signal-perf-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-signal-perf-

      - name: Run worth-signal performance lane
        run: bash scripts/ci/run_signal_perf_lane.sh

      - name: Run worth-signal determinism certification lane
        run: bash scripts/ci/check_signal_parallel_determinism_cert.sh 4 "${SIGNAL_DETERMINISM_DIR}"

      - name: Run worth-signal adversarial determinism lane
        run: |
          cargo test -p worth-signal --lib --features parallel adversarial_parallel -- --ignored --nocapture
          cargo test -p worth-signal --lib --features parallel transaction_stress -- --nocapture
          bash scripts/ci/check_signal_adversarial_workflows.sh --long

      - name: Upload worth-signal performance report
        uses: actions/upload-artifact@v4
        with:
          name: worth-signal-parallel-perf-report
          path: ${{ env.SIGNAL_PERF_REPORT_PATH }}
          if-no-files-found: error

      - name: Upload worth-signal determinism certification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worth-signal-determinism-cert
          path: ${{ env.SIGNAL_DETERMINISM_DIR }}
          if-no-files-found: error
