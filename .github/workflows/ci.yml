name: WORTH CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: worth-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test, Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Worth Signals documentation dependencies
        working-directory: crates/worth-signal-wasm
        run: npm ci

      - name: Worth Signals public documentation gate
        working-directory: crates/worth-signal-wasm
        run: |
          npm run test:documentation
          npm run typecheck:package-surface

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Delivery guards
        run: python3 scripts/ci/check_delivery_guards.py

      - name: Worth UI Phase 10 authority boundary guard
        run: python3 scripts/ci/check_worth_ui_phase_10_authority_boundaries.py

      - name: Determinism guards
        run: python3 scripts/ci/check_determinism_guards.py

      - name: Signal runtime guards
        run: bash scripts/ci/check_signal_runtime_guards.sh

      - name: Workspace Rust line caps
        run: bash scripts/ci/check_workspace_rust_line_caps.sh

      - name: Constitution
        shell: pwsh
        run: pwsh -File scripts/check-constitution.ps1 --format json

      - name: Road 1 adoption certification corpus
        run: cargo test --manifest-path cad/workspaces/worth-certification/Cargo.toml -p worth-cert-adoption --test compile_fail

      - name: Build workspace
        run: cargo build --workspace

      - name: worth-signal parallel semantic check
        run: cargo check -p worth-signal --features parallel

      - name: worth-signal core profile gate
        run: bash scripts/ci/check_signal_core_profiles.sh

      - name: worth-signal adversarial parallel lane
        run: cargo test -p worth-signal --lib --features parallel adversarial_parallel -- --nocapture

      - name: worth-signal diagnostics lane
        run: cargo test -p worth-signal --lib --features parallel diagnostics -- --nocapture

      - name: worth-signal harness replay lane
        run: cargo test -p worth-signal --lib --features parallel harness_adapter -- --nocapture

      - name: worth-signal phase 5 contract lane
        run: bash scripts/ci/check_signal_phase5_contracts.sh

      - name: worth-signal adversarial workflow lane
        run: bash scripts/ci/check_signal_adversarial_workflows.sh

      - name: worth-signal transaction adversarial lane
        run: cargo test -p worth-signal --lib --features parallel transaction_ -- --nocapture

      - name: worth-signal failure matrix gate
        run: bash scripts/ci/check_signal_failure_matrix.sh

      - name: worth-signal contract matrix gate
        run: bash scripts/ci/check_signal_contract_matrix.sh

      - name: worth-signal resource bounds gate
        run: bash scripts/ci/check_signal_resource_bounds.sh

      - name: worth-signal semantic snapshot diff lane
        run: bash scripts/ci/check_signal_semantic_snapshots.sh "${RUNNER_TEMP}/signal-semantic-snapshots"

      - name: Run tests
        run: cargo test --workspace

      - name: Run WORTH Query ordinary tests
        run: cargo test --manifest-path workspaces/worth-query/Cargo.toml --workspace --exclude worth-query-certification --exclude worth-query-replay

      - name: Run WORTH Query cold certification
        run: cargo test --manifest-path workspaces/worth-query/Cargo.toml -p worth-query-certification -p worth-query-replay

      - name: Upload worth-signal semantic snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worth-signal-semantic-snapshots
          path: ${{ runner.temp }}/signal-semantic-snapshots
          if-no-files-found: ignore

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace -- -D warnings

      - name: Clippy WORTH Query workspace
        run: cargo clippy --manifest-path workspaces/worth-query/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Benchmarks compile
        run: cargo bench --workspace --no-run

  miri:
    name: Miri (worth-math)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly + miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-

      - name: Run miri on worth-math
        run: cargo +nightly miri test -p worth-math

  worth-store-quality:
    name: WORTH Store quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: workspaces/worth-store
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workspaces/worth-store -> target
          shared-key: worth-store-quality
          cache-on-failure: true
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lint every Store target
        run: cargo clippy --workspace --all-targets -- -D warnings

  worth-store-tests:
    name: WORTH Store tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, formal: true }
          - { os: windows-latest, formal: false }
    defaults:
      run:
        working-directory: workspaces/worth-store
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workspaces/worth-store -> target
          shared-key: worth-store-tests
          cache-on-failure: true
      - name: Install TLC runtime
        if: matrix.formal
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unit and doctests
        run: cargo store-ci --partition owner-unit
      - name: Integration scenarios
        run: cargo store-ci --partition scenario
      - name: Compiler boundaries
        run: cargo store-ci --partition ui
      - name: Formal models
        if: matrix.formal
        run: cargo store-ci --partition formal

  worth-store-release-scale:
    name: WORTH Store release-scale backup
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workspaces/worth-store -> target
          shared-key: worth-store-release-scale
      - name: Two GiB bounded backup proof
        working-directory: workspaces/worth-store
        shell: bash
        run: |
          cargo test -p worth-store-operations --lib phase_1_6_tests::release_scale_backup::two_gib_owner_bundle_stays_bounded_through_materialization_and_independent_verification -- --ignored --exact --nocapture --test-threads=1
          cargo test -p worth-store-physical-certification --lib harness::blob::tests::replay_bundle_is_stable_and_carries_exact_blob_counter_evidence -- --ignored --exact --nocapture --test-threads=1
          cargo test -p worth-store-physical-certification --lib harness::blob::heavy_qualification_tests::heavy_replay_bundle_carries_evidence_oracles -- --ignored --exact --nocapture --test-threads=1
          cargo test -p worth-store-physical-certification --lib harness::blob::tests::real_multi_gb_temp_file_fixture_emits_heavy_topology_evidence -- --ignored --exact --nocapture --test-threads=1
          cargo test -p worth-store-certification --lib courtroom::blobs::closeout::tests::blob_closeout_binds_executed_harness_evidence -- --ignored --exact --nocapture --test-threads=1
          cargo test -p worth-store-certification --test durability_recovery s10_operational_world::a_scenario_cannot_be_relabelled_as_another_owner_topology -- --ignored --exact --nocapture --test-threads=1
          cargo test -p worth-store-certification --test durability_recovery s10_operational_world::a_small_real_repair_receipt_cannot_claim_the_hundreds_region_program -- --ignored --exact --nocapture --test-threads=1
          cargo test -p worth-store-certification --test durability_recovery s10_operational_world::ci_and_release_profiles_preserve_the_scenario_topology -- --ignored --exact --nocapture --test-threads=1
          cargo test -p worth-store-certification --test durability_recovery s10_operational_world::ci_and_release_suites_join_all_three_scenarios -- --ignored --exact --nocapture --test-threads=1
          cargo test -p worth-store-certification --test durability_recovery s10_operational_world::reached_yieldpoint_labels_cannot_close_s10_without_fresh_process_crash_evidence -- --ignored --exact --nocapture --test-threads=1

  worth_ui_quality:
    name: WORTH UI Quality and Topology
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-worth-ui

      - name: Enforce WORTH UI test and CI topology
        run: |
          python3 scripts/ci/test_worth_ui_test_topology.py
          python3 scripts/ci/test_worth_ui_test_lane.py
          python3 scripts/ci/check_worth_ui_test_topology.py

      - name: Check WORTH UI formatting
        run: cargo fmt --all --manifest-path workspaces/worth-ui/Cargo.toml -- --check

      - name: Lint WORTH UI
        run: cargo clippy --workspace --all-targets --all-features --manifest-path workspaces/worth-ui/Cargo.toml -- -D warnings

  worth_ui_fast:
    name: WORTH UI Fast and Documentation Proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORTH_UI_LANE_REPORT_DIR: ${{ runner.temp }}/worth-ui-lane-reports

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-worth-ui

      - name: WORTH UI fast developer proof
        run: python3 scripts/ci/run_worth_ui_test_lane.py fast

      - name: WORTH UI documentation proof
        run: python3 scripts/ci/run_worth_ui_test_lane.py documentation

      - name: Upload WORTH UI fast evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worth-ui-fast-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worth-ui-lane-reports
          if-no-files-found: warn
          retention-days: 14

  worth_ui_compile_contracts:
    name: WORTH UI Compile Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORTH_UI_LANE_REPORT_DIR: ${{ runner.temp }}/worth-ui-lane-reports

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-worth-ui

      - name: WORTH UI compile contracts
        run: python3 scripts/ci/run_worth_ui_test_lane.py compile-contracts

      - name: Upload WORTH UI compile-contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worth-ui-compile-contracts-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worth-ui-lane-reports
          if-no-files-found: warn
          retention-days: 14

  worth_ui_hostile_certification:
    name: WORTH UI Hostile Certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORTH_UI_LANE_REPORT_DIR: ${{ runner.temp }}/worth-ui-lane-reports

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-worth-ui

      - name: WORTH UI hostile certification
        run: python3 scripts/ci/run_worth_ui_test_lane.py hostile-certification

      - name: Upload WORTH UI hostile-certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worth-ui-hostile-certification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worth-ui-lane-reports
          if-no-files-found: warn
          retention-days: 14

  worth_ui_dependency_contract:
    name: WORTH UI External Dependency Contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WORTH_UI_LANE_REPORT_DIR: ${{ runner.temp }}/worth-ui-lane-reports

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-worth-ui

      - name: WORTH UI dependency contract
        run: python3 scripts/ci/run_worth_ui_test_lane.py dependency-contract

      - name: Upload WORTH UI dependency-contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worth-ui-dependency-contract-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worth-ui-lane-reports
          if-no-files-found: warn
          retention-days: 14

  worth_ui_windows_check:
    name: WORTH UI Windows Compile Check
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WORTH_UI_LANE_REPORT_DIR: ${{ runner.temp }}/worth-ui-lane-reports

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-worth-ui

      - name: WORTH UI Windows all-target compile check
        run: python scripts/ci/run_worth_ui_test_lane.py platform-check

      - name: WORTH UI Windows real filesystem contracts
        run: python scripts/ci/run_worth_ui_test_lane.py filesystem-contract

      - name: Upload WORTH UI Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worth-ui-windows-check-${{ github.run_attempt }}
          path: ${{ runner.temp }}/worth-ui-lane-reports
          if-no-files-found: warn
          retention-days: 14

  worth_ui_proof:
    name: WORTH UI Proof Closure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - worth_ui_quality
      - worth_ui_fast
      - worth_ui_compile_contracts
      - worth_ui_hostile_certification
      - worth_ui_dependency_contract
      - worth_ui_windows_check
    env:
      QUALITY_RESULT: ${{ needs.worth_ui_quality.result }}
      FAST_RESULT: ${{ needs.worth_ui_fast.result }}
      COMPILE_RESULT: ${{ needs.worth_ui_compile_contracts.result }}
      HOSTILE_RESULT: ${{ needs.worth_ui_hostile_certification.result }}
      DEPENDENCY_RESULT: ${{ needs.worth_ui_dependency_contract.result }}
      WINDOWS_RESULT: ${{ needs.worth_ui_windows_check.result }}

    steps:
      - name: Require every WORTH UI proof component
        shell: bash
        run: |
          for result in \
            "$QUALITY_RESULT" \
            "$FAST_RESULT" \
            "$COMPILE_RESULT" \
            "$HOSTILE_RESULT" \
            "$DEPENDENCY_RESULT" \
            "$WINDOWS_RESULT"
          do
            if [ "$result" != "success" ]; then
              echo "A required WORTH UI proof component finished as: $result" >&2
              exit 1
            fi
          done

  signal-perf:
    name: Signal Performance Lane
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-signal-perf-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-signal-perf-

      - name: Run worth-signal performance lane
        env:
          SIGNAL_PERF_REPORT_PATH: ${{ runner.temp }}/signal-parallel-perf-report.json
        run: bash scripts/ci/run_signal_perf_lane.sh

      - name: Run worth-signal determinism certification lane
        run: bash scripts/ci/check_signal_parallel_determinism_cert.sh 4 "${RUNNER_TEMP}/signal-determinism-cert"

      - name: Run worth-signal adversarial determinism lane
        run: |
          cargo test -p worth-signal --lib --features parallel adversarial_parallel -- --ignored --nocapture
          cargo test -p worth-signal --lib --features parallel transaction_stress -- --nocapture
          bash scripts/ci/check_signal_adversarial_workflows.sh --long

      - name: Upload worth-signal performance report
        uses: actions/upload-artifact@v4
        with:
          name: worth-signal-parallel-perf-report
          path: ${{ runner.temp }}/signal-parallel-perf-report.json
          if-no-files-found: error

      - name: Upload worth-signal determinism certification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worth-signal-determinism-cert
          path: ${{ runner.temp }}/signal-determinism-cert
          if-no-files-found: error
