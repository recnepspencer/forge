[workspace]
resolver = "2"
members = [
    "crates/forge-harness",
    "crates/worth-primitives",
    "crates/worth-math",
    "crates/worth-schema",
    "crates/worth-topo",
    "crates/worth-spatial",
    "crates/forge-core",
    "crates/forge-topo",
    "crates/worth-geom",
    "crates/worth-kernel",
    "crates/forge-kernel",
    "crates/forge-io",
    "crates/hadwiger-research",


    "crates/forge-repr",
    "crates/forge-schema",
    "crates/forge-spec",
    "crates/forge-runtime-bridge",
    "crates/forge-server",
    "crates/forge-query",
    "crates/forge-foundational",
    "crates/forge-proof",
    "crates/forge-store",
    "crates/forge-signal",
    "crates/forge-signal-wasm",
    "crates/forge-spatial",
    # UI library stack
    "crates/forge-ui-types",
    "crates/forge-ui-theme",
    "crates/forge-ui-components",
    "crates/forge-ui-adapters",
    "crates/forge-ui-state",
    "crates/forge-ui", "crates/forge-relational",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
forge-harness = { path = "crates/forge-harness", version = "0.1.0" }
# Internal crates — kernel
worth-primitives = { path = "crates/worth-primitives" }
worth-math = { path = "crates/worth-math" }
worth-schema = { path = "crates/worth-schema" }
worth-topo = { path = "crates/worth-topo" }
worth-spatial = { path = "crates/worth-spatial" }
forge-core = { path = "crates/forge-core" }
forge-topo = { path = "crates/forge-topo" }
worth-geom = { path = "crates/worth-geom" }
worth-kernel = { path = "crates/worth-kernel" }
forge-kernel = { path = "crates/forge-kernel" }
forge-io = { path = "crates/forge-io" }
hadwiger-research = { path = "crates/hadwiger-research" }


forge-repr = { path = "crates/forge-repr" }
forge-schema = { path = "crates/forge-schema" }
forge-spec = { path = "crates/forge-spec" }
forge-runtime-bridge = { path = "crates/forge-runtime-bridge" }
forge-server = { path = "crates/forge-server" }
forge-query = { path = "crates/forge-query" }
forge-foundational = { path = "crates/forge-foundational" }
forge-proof = { path = "crates/forge-proof" }
forge-store = { path = "crates/forge-store" }
forge-signal = { path = "crates/forge-signal" }
forge-signal-wasm = { path = "crates/forge-signal-wasm" }
forge-spatial = { path = "crates/forge-spatial" }
forge-relational = { path = "crates/forge-relational" }
# Internal crates — UI library stack
forge-ui-types      = { path = "crates/forge-ui-types" }
forge-ui-theme      = { path = "crates/forge-ui-theme" }
forge-ui-components = { path = "crates/forge-ui-components" }
forge-ui-adapters   = { path = "crates/forge-ui-adapters" }
forge-ui-state      = { path = "crates/forge-ui-state" }
forge-ui            = { path = "crates/forge-ui" }

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Testing
trybuild = "1.0"
varisat = "0.2.1"
good_lp = { version = "1.15.2", default-features = false, features = ["minilp"] }
clarabel = "0.11.1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Native GUI (eframe for MVP shell; wgpu for full viewport in M5)
eframe    = { version = "0.31", features = ["default", "wgpu"] }
egui      = "0.31"
egui-wgpu = "0.31"
notify   = "7"
wgpu     = "24"
winit    = "0.30"
pollster = "0.3"
glam     = "0.29"

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
smallvec = "1"
rayon = "1"

# ---- Workspace-wide lint policy ----
# These apply to every crate that declares `lints.workspace = true`.
# Warnings fail the build automatically — no need to remember `-D warnings`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
result_large_err = "allow"

# ---- Profile tuning ----
# Dev/test builds: opt-level 1 for workspace crates (fast compile, much faster runtime),
# opt-level 2 for all dependencies (cached anyway, full speed).
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 1
