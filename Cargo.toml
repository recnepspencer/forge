[workspace]
resolver = "2"
members = [
    "crates/forge-harness",
    "crates/forge-math",
    "crates/forge-core",
    "crates/forge-topo",
    "crates/forge-geom",
    "crates/forge-kernel",
    "crates/forge-io",


    "crates/forge-repr",
    "crates/forge-schema",
    "crates/forge-spec",
    "crates/forge-signal",
    "crates/forge-signal-wasm",
    "crates/forge-spatial",
    # UI library stack
    "crates/forge-ui-types",
    "crates/forge-ui-theme",
    "crates/forge-ui-components",
    "crates/forge-ui-adapters",
    "crates/forge-ui-state",
    "crates/forge-ui", "crates/forge-relational",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
forge-harness = { path = "crates/forge-harness", version = "0.1.0" }
# Internal crates — kernel
forge-math = { path = "crates/forge-math" }
forge-core = { path = "crates/forge-core" }
forge-topo = { path = "crates/forge-topo" }
forge-geom = { path = "crates/forge-geom" }
forge-kernel = { path = "crates/forge-kernel" }
forge-io = { path = "crates/forge-io" }


forge-repr = { path = "crates/forge-repr" }
forge-schema = { path = "crates/forge-schema" }
forge-spec = { path = "crates/forge-spec" }
forge-signal = { path = "crates/forge-signal" }
forge-signal-wasm = { path = "crates/forge-signal-wasm" }
forge-spatial = { path = "crates/forge-spatial" }
# Internal crates — UI library stack
forge-ui-types      = { path = "crates/forge-ui-types" }
forge-ui-theme      = { path = "crates/forge-ui-theme" }
forge-ui-components = { path = "crates/forge-ui-components" }
forge-ui-adapters   = { path = "crates/forge-ui-adapters" }
forge-ui-state      = { path = "crates/forge-ui-state" }
forge-ui            = { path = "crates/forge-ui" }

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Testing
trybuild = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Native GUI (eframe for MVP shell; wgpu for full viewport in M5)
eframe    = { version = "0.31", features = ["default", "wgpu"] }
egui      = "0.31"
egui-wgpu = "0.31"
notify   = "7"
wgpu     = "24"
winit    = "0.30"
pollster = "0.3"
glam     = "0.29"

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
smallvec = "1"
rayon = "1"

# ---- Workspace-wide lint policy ----
# These apply to every crate that declares `lints.workspace = true`.
# Warnings fail the build automatically — no need to remember `-D warnings`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
result_large_err = "allow"

# ---- Profile tuning ----
# Dev/test builds: opt-level 1 for workspace crates (fast compile, much faster runtime),
# opt-level 2 for all dependencies (cached anyway, full speed).
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 2

[profile.test.package."*"]
opt-level = 2
