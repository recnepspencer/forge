[package]
name = "worth-store-layout-indexes"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Durable artifact layout, indexing, and access-path authority."

[dependencies]
worth-foundational = { path = "../../../../crates/worth-foundational" }
worth-proof = { path = "../../../../crates/worth-proof" }
worth-store-authority = { path = "../worth-store-authority" }
worth-store-budgets = { path = "../worth-store-budgets" }
worth-store-blob-chunks = { path = "../worth-store-blob-chunks" }
worth-store-compatibility = { path = "../worth-store-compatibility" }
worth-store-contracts = { path = "../worth-store-contracts" }
worth-store-io-scheduler = { path = "../worth-store-io-scheduler" }
worth-store-lsm-authority = { path = "../worth-store-lsm-authority" }
worth-store-offline-verifier = { path = "../worth-store-offline-verifier" }
worth-store-physical-format = { path = "../worth-store-physical-format" }
worth-store-physical-isolation = { path = "../worth-store-physical-isolation", features = ["phase20-layout-rule-construction"] }
worth-store-physical-integrity = { path = "../worth-store-physical-integrity" }
worth-store-recovery-physics = { path = "../worth-store-recovery-physics", features = ["phase21-layout-rule-construction", "phase22-layout-rule-construction"] }
worth-store-security = { path = "../worth-store-security" }
worth-store-wal = { path = "../worth-store-wal" }
sha2 = "0.10"

[dev-dependencies]
worth-store-aspect-native = { path = "../worth-store-aspect-native" }
worth-store-blob-chunks = { path = "../worth-store-blob-chunks", features = ["certification-test-authority"] }
worth-store-budgets = { path = "../worth-store-budgets" }
worth-store-certification = { path = "../worth-store-certification" }
worth-store-io-scheduler = { path = "../worth-store-io-scheduler", features = ["certification-test-authority"] }
worth-store = { path = "../worth-store" }
worth-store-operations = { path = "../worth-store-operations" }
worth-store-physical-certification = { path = "../worth-store-physical-certification" }
worth-store-physical-format = { path = "../worth-store-physical-format" }
worth-store-physical-isolation = { path = "../worth-store-physical-isolation", features = ["phase20-layout-rule-construction"] }
worth-store-recovery-physics = { path = "../worth-store-recovery-physics", features = ["phase21-layout-rule-construction", "phase22-layout-rule-construction"] }
worth-store-security = { path = "../worth-store-security", features = ["certification-test-authority"] }
worth-store-test-support = { path = "../worth-store-test-support" }
worth-store-wal = { path = "../worth-store-wal", features = ["certification-authority"] }

[lints]
workspace = true
