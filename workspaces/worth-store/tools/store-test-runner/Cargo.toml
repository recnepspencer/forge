[package]
name = "store-test-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
worth-store = { workspace = true, optional = true }

[features]
physical-work-evidence = [
    "dep:worth-store",
    "worth-store/certification-test-authority",
]
