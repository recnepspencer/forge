[workspace]
resolver = "2"
members = ["crates/bank-domain"]
default-members = ["crates/bank-domain"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
worth-foundational = { path = "../../crates/worth-foundational" }
worth-query-decl = { path = "../worth-query/crates/worth-query-decl" }
worth-query-host = { path = "../worth-query/crates/worth-query-host" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 0

[profile.test.package."*"]
opt-level = 2
