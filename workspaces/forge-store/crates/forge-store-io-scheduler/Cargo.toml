[package]
name = "forge-store-io-scheduler"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Roadmap 2 S.6 hardware-aware I/O, QoS, and background pacing."

[features]
certification-test-authority = [
    "forge-store-physical-backend/certification-test-authority",
    "forge-store-physical-isolation/certification-authority",
    "forge-store-security/certification-test-authority",
]

[dependencies]
forge-foundational = { path = "../../../../crates/forge-foundational" }
forge-proof = { path = "../../../../crates/forge-proof" }
forge-store-budgets.workspace = true
forge-store-contracts.workspace = true
forge-store-buffer-pool.workspace = true
forge-store-physical-backend.workspace = true
forge-store-physical-isolation.workspace = true
forge-store-security.workspace = true
forge-store-wal.workspace = true

[dev-dependencies]
forge-store-blob-chunks.workspace = true
forge-store-offline-verifier.workspace = true
forge-store-operations.workspace = true
forge-store-physical-backend = { workspace = true, features = ["certification-test-authority"] }
forge-store-physical-integrity.workspace = true
forge-store-physical-isolation = { workspace = true, features = ["certification-authority"] }
forge-store-readiness.workspace = true
forge-store-security = { workspace = true, features = ["certification-test-authority"] }

[lints]
workspace = true
