[package]
name = "forge-store-operations"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Roadmap 2 S.10 operational safety, backup, PITR, repair, and forensics."

[features]
default = []
certification-test-authority = [
    "dep:forge-foundational",
    "dep:forge-store-aspect-native",
    "forge-store-security/certification-test-authority",
]

[dependencies]
forge-foundational = { path = "../../../../crates/forge-foundational", optional = true }
forge-proof = { path = "../../../../crates/forge-proof" }
forge-store-aspect-native = { workspace = true, optional = true }
forge-store-authority.workspace = true
forge-store-blob-chunks.workspace = true
forge-store-contracts.workspace = true
forge-store-io-scheduler.workspace = true
forge-store-layout-indexes.workspace = true
forge-store-offline-verifier.workspace = true
forge-store-operations-vocabulary.workspace = true
forge-store-physical-integrity.workspace = true
forge-store-recovery-physics.workspace = true
forge-store-security.workspace = true
forge-store-tiering.workspace = true

[dev-dependencies]
forge-foundational = { path = "../../../../crates/forge-foundational" }
forge-store-aspect-native.workspace = true
forge-store-blob-chunks = { workspace = true, features = ["certification-test-authority"] }
forge-store-readiness.workspace = true

[lints]
workspace = true
