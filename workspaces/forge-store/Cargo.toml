[workspace]
resolver = "2"
members = [
    "crates/forge-store",
    "crates/forge-store-analysis",
    "crates/forge-store-authority",
    "crates/forge-store-blob-chunks",
    "crates/forge-store-branch-deltas",
    "crates/forge-store-bulk",
    "crates/forge-store-budgets",
    "crates/forge-store-buffer-pool",
    "crates/forge-store-certification",
    "crates/forge-store-claim-boundaries",
    "crates/forge-store-compatibility",
    "crates/forge-store-contracts",
    "crates/forge-store-extensions",
    "crates/forge-store-formal-models",
    "crates/forge-store-io-scheduler",
    "crates/forge-store-layout-indexes",
    "crates/forge-store-live-query",
    "crates/forge-store-maintenance",
    "crates/forge-store-modes",
    "crates/forge-store-offline-verifier",
    "crates/forge-store-operations",
    "crates/forge-store-physical-backend",
    "crates/forge-store-physical-certification",
    "crates/forge-store-physical-format",
    "crates/forge-store-physical-integrity",
    "crates/forge-store-physical-isolation",
    "crates/forge-store-recovery-physics",
    "crates/forge-store-replication",
    "crates/forge-store-retention",
    "crates/forge-store-s0-reclassification",
    "crates/forge-store-schema-lineage",
    "crates/forge-store-security",
    "crates/forge-store-snapshots",
    "crates/forge-store-subscription-support",
    "crates/forge-store-test-support",
    "crates/forge-store-tiering",
    "crates/forge-store-wal",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
forge-store-analysis = { path = "crates/forge-store-analysis" }
forge-store-authority = { path = "crates/forge-store-authority" }
forge-store-blob-chunks = { path = "crates/forge-store-blob-chunks" }
forge-store-branch-deltas = { path = "crates/forge-store-branch-deltas" }
forge-store-bulk = { path = "crates/forge-store-bulk" }
forge-store-budgets = { path = "crates/forge-store-budgets" }
forge-store-buffer-pool = { path = "crates/forge-store-buffer-pool" }
forge-store-certification = { path = "crates/forge-store-certification" }
forge-store-claim-boundaries = { path = "crates/forge-store-claim-boundaries" }
forge-store-compatibility = { path = "crates/forge-store-compatibility" }
forge-store-contracts = { path = "crates/forge-store-contracts" }
forge-store-extensions = { path = "crates/forge-store-extensions" }
forge-store-formal-models = { path = "crates/forge-store-formal-models" }
forge-store-io-scheduler = { path = "crates/forge-store-io-scheduler" }
forge-store-layout-indexes = { path = "crates/forge-store-layout-indexes" }
forge-store-live-query = { path = "crates/forge-store-live-query" }
forge-store-maintenance = { path = "crates/forge-store-maintenance" }
forge-store-modes = { path = "crates/forge-store-modes" }
forge-store-offline-verifier = { path = "crates/forge-store-offline-verifier" }
forge-store-operations = { path = "crates/forge-store-operations" }
forge-store-physical-backend = { path = "crates/forge-store-physical-backend" }
forge-store-physical-certification = { path = "crates/forge-store-physical-certification" }
forge-store-physical-format = { path = "crates/forge-store-physical-format" }
forge-store-physical-integrity = { path = "crates/forge-store-physical-integrity" }
forge-store-physical-isolation = { path = "crates/forge-store-physical-isolation" }
forge-store-recovery-physics = { path = "crates/forge-store-recovery-physics" }
forge-store-replication = { path = "crates/forge-store-replication" }
forge-store-retention = { path = "crates/forge-store-retention" }
forge-store-s0-reclassification = { path = "crates/forge-store-s0-reclassification" }
forge-store-schema-lineage = { path = "crates/forge-store-schema-lineage" }
forge-store-security = { path = "crates/forge-store-security" }
forge-store-snapshots = { path = "crates/forge-store-snapshots" }
forge-store-subscription-support = { path = "crates/forge-store-subscription-support" }
forge-store-test-support = { path = "crates/forge-store-test-support" }
forge-store-tiering = { path = "crates/forge-store-tiering" }
forge-store-wal = { path = "crates/forge-store-wal" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
result_large_err = "allow"
