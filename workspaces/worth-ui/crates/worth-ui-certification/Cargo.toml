[package]
name = "worth-ui-certification"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "worth_ui_certification"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
syn = { version = "2.0", features = ["full", "visit"] }
toml = "0.8"
worth-ui-host-contract = { path = "../worth-ui-host-contract" }
worth-ui-runtime = { path = "../worth-ui-runtime" }
worth-ui-test-support = { path = "../worth-ui-test-support" }

[dev-dependencies]
trybuild = { workspace = true }
worth-foundational = { path = "../../../../crates/worth-foundational" }
worth-query = { path = "../../../../crates/worth-query" }
worth-ui-dsl = { path = "../worth-ui-dsl" }
worth-ui-inspection = { path = "../worth-ui-inspection" }
worth-ui-query-binding = { path = "../worth-ui-query-binding", features = ["certification-construction"] }
worth-ui = { path = "../worth-ui" }
