[package]
name = "worth-ui-runtime"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "worth_ui_runtime"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []
# Enables public re-export of SUPPORT AUTHORITY fixtures for worth-ui-test-support only.
certification-support = ["worth-ui-query-binding/certification-construction"]

[dependencies]
notify = { workspace = true }
worth-foundational = { path = "../../../../crates/worth-foundational" }
worth-proof = { path = "../../../../crates/worth-proof" }
worth-ui-dsl = { path = "../worth-ui-dsl" }
worth-ui-inspection = { path = "../worth-ui-inspection" }
worth-ui-query-binding = { path = "../worth-ui-query-binding" }
worth-ui-host-contract = { path = "../worth-ui-host-contract" }

[dev-dependencies]
egui = { workspace = true }
worth-ui-host-egui = { path = "../worth-ui-host-egui" }
worth-ui-query-binding = { path = "../worth-ui-query-binding", features = ["certification-construction"] }
