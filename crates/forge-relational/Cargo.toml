[package]
name = "forge-relational"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "A standalone truth runtime for transactional, inspectable, replayable graph state."
readme = "README.md"
repository = "https://github.com/recnepspencer/forge"
keywords = ["graph", "runtime", "transactions", "replay", "simulation"]
categories = ["data-structures", "database-implementations", "science"]

[dependencies]
forge-foundational = { path = "../forge-foundational" }
forge-proof = { path = "../forge-proof" }
forge-runtime-bridge = { path = "../forge-runtime-bridge" }
serde = { version = "1", features = ["derive", "rc"] }
rmp-serde = "1.3"
rayon = "1"
smallvec = "1"
sha2 = "0.10"

[dev-dependencies]
forge-harness.workspace = true
proptest = "1"
trybuild = "1"

[lints]
workspace = true
