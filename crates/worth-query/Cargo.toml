[package]
name = "worth-query"
autotests = false
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Canonical typed query artifact authority for Worth."
repository = "https://github.com/recnepspencer/WORTH"
keywords = ["query", "canonicalization", "facade", "typed"]
categories = ["data-structures", "science"]

[dependencies]
arc-swap = "1"
worth-foundational = { path = "../worth-foundational" }
worth-proof = { path = "../worth-proof" }
worth-relational = { path = "../worth-relational" }
worth-runtime-bridge = { path = "../worth-runtime-bridge" }
worth-signal = { path = "../worth-signal" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
trybuild.workspace = true

[lints]
workspace = true
