[package]
name = "worth-schema"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Topology truth vocabulary, aspects, and invariant declarations"

[lib]
name = "schema"

[features]
conflict-routing-internal-authority = []
touched-graph-parity-internal-authority = []

[[test]]
name = "touched_graph_conflict_internal_authority"
path = "tests/touched_graph_conflict_internal_authority.rs"
required-features = ["conflict-routing-internal-authority"]

[dependencies]
forge-foundational.workspace = true
forge-query.workspace = true
forge-relational.workspace = true
forge-runtime-bridge.workspace = true
forge-signal.workspace = true
math = { package = "worth-math", path = "../worth-math" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
worth-primitives.workspace = true

[dev-dependencies]
trybuild.workspace = true

[lints]
workspace = true
