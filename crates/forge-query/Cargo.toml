[package]
name = "forge-query"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Canonical typed query artifact authority for Forge."
repository = "https://github.com/recnepspencer/forge"
keywords = ["query", "canonicalization", "facade", "typed"]
categories = ["data-structures", "science"]

[dependencies]
arc-swap = "1"
forge-foundational = { path = "../forge-foundational" }
forge-proof = { path = "../forge-proof" }
forge-relational = { path = "../forge-relational" }
forge-runtime-bridge = { path = "../forge-runtime-bridge" }
forge-signal = { path = "../forge-signal" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
trybuild.workspace = true

[lints]
workspace = true
