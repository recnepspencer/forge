[package]
name = "forge-query"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Canonical typed query artifact authority for Forge."
repository = "https://github.com/recnepspencer/forge"
keywords = ["query", "canonicalization", "facade", "typed"]
categories = ["data-structures", "science"]

[dependencies]
arc-swap = "1"
forge-foundational.workspace = true
forge-proof.workspace = true
forge-relational.workspace = true
forge-runtime-bridge.workspace = true
forge-signal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
trybuild.workspace = true

[lints]
workspace = true
