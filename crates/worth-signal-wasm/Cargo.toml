[package]
name = "worth-signal-wasm"
edition.workspace = true
version = "1.3.0"
description = "WebAssembly facade for Worth Signal"
repository = "https://github.com/recnepspencer/forge"
license = "UNLICENSED"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["profile-extended"]
profile-compact = ["worth-signal/profile-compact"]
profile-standard = ["worth-signal/profile-standard"]
profile-extended = ["worth-signal/profile-extended"]

[dependencies]
worth-proof = { workspace = true }
worth-signal = { path = "../worth-signal", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
sha2 = "0.10"
base64 = "0.22"
rmp-serde = "1.3"

[dev-dependencies]
trybuild.workspace = true

[lints]
workspace = true
