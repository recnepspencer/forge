[package]
name = "forge-view"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Representation traits and trace viewer for the Forge geometry kernel"

[[bin]]
name = "forge-trace-server"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "forge-trace-viewer"
path = "src/viewer_main.rs"
required-features = ["gui"]

[[bin]]
name = "forge-trace-cli"
path = "src/cli_main.rs"

[features]
default = []
server = ["dep:axum", "dep:tokio", "dep:tower-http"]
gui = ["dep:eframe", "dep:notify"]

[dependencies]
forge-core = { path = "../forge-core" }
serde = { workspace = true }
serde_json = { workspace = true }

# Web server (trace-server binary)
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.6", features = ["cors", "fs"], optional = true }

# Native GUI (trace-viewer binary)
eframe = { workspace = true, optional = true }
notify = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
