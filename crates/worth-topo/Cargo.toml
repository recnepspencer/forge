[package]
name = "worth-topo"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Topology materialization and structural interpretation"

[lib]
name = "topology"

[features]
slow-certification = []
test-support-lowering = []

[[test]]
name = "public_api_contract"
path = "src/certification/public_facade_contracts/contracts/public_api_contract_entry.rs"

[[test]]
name = "public_topology_operator_closeout_contract"
path = "src/certification/public_facade_contracts/contracts/topology_operator_closeout.rs"

[dependencies]
forge-foundational.workspace = true
forge-query.workspace = true
forge-relational.workspace = true
forge-runtime-bridge.workspace = true
worth-primitives.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
schema = { package = "worth-schema", path = "../worth-schema", features = ["conflict-routing-internal-authority"] }

[dev-dependencies]
trybuild.workspace = true

[lints]
workspace = true
