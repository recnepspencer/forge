[package]
name = "worth-kernel"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Primitive construction orchestration for the Worth stack"

[[test]]
name = "public_api_contract"
path = "src/certification/public_facade_contracts/contracts/public_api.rs"

[[test]]
name = "ui"
path = "src/certification/public_facade_contracts/compile_fail_contracts.rs"

[dependencies]
forge-foundational.workspace = true
forge-query.workspace = true
forge-proof.workspace = true
worth-primitives.workspace = true
worth-geom.workspace = true
worth-math.workspace = true
worth-spatial.workspace = true
worth-topo = { workspace = true, features = ["kernel-diagnostic-support"] }
worth-schema.workspace = true
sha2 = "0.10"

[dev-dependencies]
trybuild.workspace = true
worth-spatial = { workspace = true, features = ["test-support-lowering"] }
worth-topo = { workspace = true, features = ["test-support-lowering", "kernel-diagnostic-support"] }

[lints]
workspace = true
