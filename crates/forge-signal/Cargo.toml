[package]
name = "forge-signal"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Generic deterministic reactive computation runtime"
readme = "README.md"
repository = "https://github.com/recnepspencer/forge"
keywords = ["incremental", "runtime", "reactive", "diagnostics", "replay"]
categories = ["data-structures", "caching", "science"]

[features]
default = ["profile-standard"]
parallel = []
profile-compact = []
profile-standard = []
profile-extended = []

[dependencies]
tracing.workspace = true
serde = { workspace = true, features = ["derive"] }
smallvec = { workspace = true, features = ["serde"] }
rayon.workspace = true
serde_json = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
forge-harness.workspace = true
stats_alloc = "0.1"
trybuild = "1"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
[lints]
workspace = true
