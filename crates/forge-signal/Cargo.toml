[package]
name = "forge-signal"
edition.workspace = true
version.workspace = true
description = "Generic deterministic reactive computation runtime"
readme = "README.md"
repository = "https://github.com/recnepspencer/forge"
publish = false
keywords = ["incremental", "runtime", "reactive", "diagnostics", "replay"]
categories = ["data-structures", "caching", "science"]

[features]
default = ["profile-extended"]
parallel = []
profile-compact = []
profile-standard = []
profile-extended = []

[dependencies]
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
smallvec = { version = "1", features = ["serde"] }
rayon = "1"
serde_json = "1"
forge-proof = { path = "../forge-proof" }
forge-foundational = { path = "../forge-foundational" }
sha2 = "0.10"

[dev-dependencies]
forge-harness.workspace = true
stats_alloc = "0.1"
trybuild = "1"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
[lints]
workspace = true
