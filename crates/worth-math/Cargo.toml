[package]
name = "worth-math"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Exact arithmetic, certified predicates, and filtered evaluation for the Worth geometry kernel"

[dependencies]
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { workspace = true, features = ["derive"] }

[features]
strict_env = []

[lints]
workspace = true

[dev-dependencies]
criterion.workspace = true
geometry-predicates = "0.3"
serde_json = "1"
trybuild = "1.0"

[[bench]]
name = "math_benchmarks"
harness = false

