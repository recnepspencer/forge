[package]
name = "forge-signal-wasm"
edition.workspace = true
version = "0.1.1"
description = "WebAssembly facade for Forge Signal"
repository = "https://github.com/recnepspencer/forge"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
forge-signal.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
sha2 = "0.10"

[lints]
workspace = true
