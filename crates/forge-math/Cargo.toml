[package]
name = "forge-math"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Exact arithmetic, certified predicates, and filtered evaluation for the Forge geometry kernel"

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
serde = { workspace = true, features = ["derive"] }

[features]
strict_env = []

[lints]
workspace = true

[dev-dependencies]
criterion.workspace = true
trybuild = "1.0"

[[bench]]
name = "math_benchmarks"
harness = false
