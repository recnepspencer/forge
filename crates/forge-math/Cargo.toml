[package]
name = "forge-math"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Exact arithmetic, certified predicates, and filtered evaluation for the Forge geometry kernel"

[dependencies]
malachite = "0.9.1"
malachite-base = "0.9.1"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { workspace = true, features = ["derive"] }

[features]
strict_env = []

[lints]
workspace = true

[dev-dependencies]
criterion.workspace = true
trybuild = "1.0"

[[bench]]
name = "math_benchmarks"
harness = false

