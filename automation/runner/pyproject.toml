[project]
name = "forge-automation-runner"
version = "0.1.0"
description = "Canonical automation runner package"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.8,<2",
    "langgraph-checkpoint-sqlite>=3.1.0,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
