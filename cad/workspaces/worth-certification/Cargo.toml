[workspace]
resolver = "2"
members = ["crates/worth-cert-adoption"]
default-members = ["crates/worth-cert-adoption"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.metadata.worth_topology]
role = "road1_subworkspace"
constitutional_lane = "worth-certification"
member_lane = "crates/*"
allowed_crate_prefixes = ["worth-cert-"]
