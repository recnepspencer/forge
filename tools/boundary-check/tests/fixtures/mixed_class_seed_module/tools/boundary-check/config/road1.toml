root_manifest = "Cargo.toml"
forbidden_root_prefixes = ["cad/workspaces/"]

[machine_authority]
canonical_config = "tools/boundary-check/config/road1.toml"
mirrored_docs = ["_docs/worthy/NAMING.md"]


[naming]
bands = ["schema", "dsl", "entry", "resolver", "solver", "derived", "pack", "app", "ui", "cert"]

[[naming.reserved_domains]]
tier = "worth"
band = "schema"
domains = ["core"]

[[naming.reserved_domains]]
tier = "worth"
band = "pack"
domains = ["registry"]

[rule_contracts]
query_host_bands = ["entry"]

[[rule_contracts.replay_surfaces]]
label = "certification replay"
package_prefixes = ["worthy-cert-replay"]
cert_domains = ["replay", "reconstruction"]

[[rule_contracts.band_rules]]
source_band = "schema"
allowed_target_bands = []

[[rule_contracts.band_rules]]
source_band = "pack"
allowed_target_bands = ["schema"]

[[born_crates]]
path = "cad/workspaces/worth-contracts/crates/worth-schema-core"
package = "worth-schema-core"

[[born_crates]]
path = "cad/workspaces/worth-packs/crates/worth-pack-registry"
package = "worth-pack-registry"

[[seed_skeletons]]
path = "cad/workspaces/worth-contracts/crates/worth-schema-core"
package = "worth-schema-core"
lib_rs = "src/lib.rs"
facade_rs = "src/facade.rs"
allowed_entries = [
  "AGENT_CONTEXT.md",
  "Cargo.toml",
  "src",
  "src/facade.rs",
  "src/lib.rs",
]

[[seed_skeletons]]
path = "cad/workspaces/worth-packs/crates/worth-pack-registry"
package = "worth-pack-registry"
lib_rs = "src/lib.rs"
facade_rs = "src/facade.rs"
allowed_entries = [
  "AGENT_CONTEXT.md",
  "Cargo.toml",
  "src",
  "src/facade.rs",
  "src/lib.rs",
]

[[subworkspaces]]
path = "cad/workspaces/worth-contracts"
allowed_crate_prefixes = ["worth-schema-"]
member_lane = "crates/*"

[[subworkspaces]]
path = "cad/workspaces/worth-packs"
allowed_crate_prefixes = ["worth-pack-"]
member_lane = "crates/*"

