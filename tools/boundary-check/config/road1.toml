[rule_contracts.public_value_reachability]
package = "worth-proof"
crate_root = "crates/worth-proof"
witness_source = "tools/boundary-check/public_value_witnesses/worth_proof/mod.rs"
worlds = [
  { name = "host-dev-default", target = "host", profile = "dev", default_features = true, features = [] },
  { name = "host-release-default", target = "host", profile = "release", default_features = true, features = [] },
]
host_timeout_ms = 120000
compilation_timeout_ms = 120000
max_output_bytes = 4194304
guidance = "Expose a checked public introduction site or record a qualified uninhabited-type exemption."

