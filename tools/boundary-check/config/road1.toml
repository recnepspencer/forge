governed_source_prefixes = ["worth-store"]
target = "worth-signal"
allowed_sources = ["worth-store"]
guidance = "the worth-store composition owner is the sole Store package allowed to own the private physical Signal runtime"

[[dependency_denials]]
workspace_manifest = "Cargo.toml"
sources = ["worth-signal"]
source_prefixes = ["worth-signal"]
forbidden_targets = ["worth-store", "worth-store-aspect-native"]
forbidden_target_prefixes = ["worth-store"]
guidance = "generic Signal cannot import Store composition or Store-owned physical aspect vocabulary"

[[dependency_denials]]
workspace_manifest = "workspaces/worth-query/Cargo.toml"
sources = []
source_prefixes = ["worth-query"]
forbidden_targets = []
forbidden_target_prefixes = ["worth-store"]
guidance = "Query defines checkpoint handoff and readmission contracts but cannot import Store persistence or reconstruction authority"

