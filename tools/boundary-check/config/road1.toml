  "worth-ui-query-binding",
  "worth-ui-runtime",
]
guidance = "Milestone 3.10.1: DSL owns authored language meaning and may not import runtime, host, Query, inspection, product-session, or mounted authority"

[[source_dependency_allowlists]]
workspace_manifest = "workspaces/worth-ui/Cargo.toml"
sources = ["worth-ui-platform-pulse"]
allowed_targets = ["eframe", "notify", "serde", "serde_json", "uiautomation", "winsafe", "worth-query-decl", "worth-query-host", "worth-ui", "worth-ui-host-egui", "xcap"]
guidance = "Milestone 3.13: the permanent Pulse remains a downstream application composition root. It may assemble Query declarations and a host only through worth-query-decl and worth-query-host, then pass audience-safe references through worth-ui. Raw Query, binding-owner, runtime, DSL, certification, test-support, replay, and convenience dependencies remain forbidden."

[[source_dependency_allowlists.dependency_contracts]]
target = "eframe"
version_requirement = "=0.35.0"
uses_default_features = false
features = ["default_fonts", "glow", "wayland", "wgpu", "x11"]

[[source_dependency_allowlists.dependency_contracts]]
target = "uiautomation"
version_requirement = "=0.25.0"
uses_default_features = false
features = ["control", "input"]

[[source_dependency_allowlists.dependency_contracts]]
