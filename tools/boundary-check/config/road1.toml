[rule_contracts]

[rule_contracts.worth_ui_query_edge]
workspace = "workspaces/worth-ui"
engine_package = "worth-query"
allowed_production_consumers = ["worth-ui-query-binding"]
guidance = "Worth UI production code consumes Query only through worth-ui-query-binding; certification is the explicit hostile-world exception. Remove the direct dependency and accept binding-owned authority/value artifacts."

[rule_contracts.query_audience]
workspace = "workspaces/worth-query"
engine_package = "worth-query"
certification_package = "worth-query-certification"
certification_authority_packages = ["worth-query-host", "worth-query-replay"]
certification_consumers = ["worth-ui-certification"]
internal_packages = [
  "worth-query-declaration",
  "worth-query-installation",
  "worth-query-admission",
  "worth-query-execution",
]

[[rule_contracts.query_audience.facade_surfaces]]
label = "worth-query-host::installed"
source = "workspaces/worth-query/crates/worth-query/src/facade/exports_installed.rs"

[[rule_contracts.query_audience.audiences]]
package = "worth-query-decl"
label = "declaration"
allowed_bands = ["entry", "cert"]
guidance = "declaration artifacts and handles"
authority_packages = ["worth-query-declaration"]

[[rule_contracts.query_audience.audiences]]
package = "worth-query-host"
label = "host"
allowed_bands = ["entry", "cert"]
guidance = "admission, lowering, and execution"
authority_packages = ["worth-query"]

[[rule_contracts.query_audience.audiences]]
package = "worth-query-replay"
label = "replay"
allowed_bands = ["cert"]
guidance = "cert-only reconstruction and replay"
authority_packages = ["worth-query"]

[[rule_contracts.replay_surfaces]]
label = "certification replay"
package_prefixes = ["worth-cert-replay", "worthy-cert-replay"]
cert_domains = ["replay", "reconstruction"]

[routing_proof]

[[routing_proof.exemplars]]
package = "worth-schema-core"
specimen = "Road 1 foundational identity / naming / tolerance specimen"
deferred_routes = [
  "`worth-entry-adoption` -> Query-native declaration/adoption facade (Milestone 3)",
  "`worth-derived-publication` -> retained/publication facade (Milestone 4)",
  "`worthy-derived-brep` -> first consumer-facing retained artifact path (Milestone 4)",
]

[[routing_proof.exemplars]]
package = "worth-pack-registry"
specimen = "Road 1 pack-seam descriptor specimen"
deferred_routes = [
  "`worth-entry-adoption` -> contribution adoption into runtime-owned work (Milestone 3)",
]

