  "worth-store-physical-isolation",
  "worth-store-recovery-physics",
  "worth-store-replication",
  "worth-store-security",
]
forbidden_targets = ["worth-store-operations", "worth-store-operations-vocabulary"]
guidance = "lower owner crates expose sealed observations, plans, and receipts; Operations orchestrates downward"

[[dependency_denials]]
workspace_manifest = "workspaces/worth-store/Cargo.toml"
sources = [
  "worth-store-aspect-native",
  "worth-store-blob-chunks",
  "worth-store-buffer-pool",
  "worth-store-io-scheduler",
  "worth-store-layout-indexes",
