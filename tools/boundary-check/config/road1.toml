[rule_contracts]
query_host_bands = ["entry"]

[[rule_contracts.replay_surfaces]]
label = "certification replay"
package_prefixes = ["worth-cert-replay", "worthy-cert-replay"]
cert_domains = ["replay", "reconstruction"]

[routing_proof]

[[routing_proof.exemplars]]
package = "worth-schema-core"
specimen = "Road 1 foundational identity / naming / tolerance specimen"
deferred_routes = [
  "`worth-entry-adoption` -> Query-native declaration/adoption facade (Milestone 3)",
  "`worth-derived-publication` -> retained/publication facade (Milestone 4)",
  "`worthy-derived-brep` -> first consumer-facing retained artifact path (Milestone 4)",
]

[[routing_proof.exemplars]]
package = "worth-pack-registry"
specimen = "Road 1 pack-seam descriptor specimen"
deferred_routes = [
  "`worth-entry-adoption` -> contribution adoption into runtime-owned work (Milestone 3)",
]

[[rule_contracts.band_rules]]
source_band = "schema"
allowed_target_bands = []

[[rule_contracts.band_rules]]
source_band = "dsl"
allowed_target_bands = ["schema"]

[[rule_contracts.band_rules]]
source_band = "entry"
allowed_target_bands = ["schema", "resolver", "derived"]

[[rule_contracts.band_rules]]
source_band = "resolver"
allowed_target_bands = ["schema", "solver"]

[[rule_contracts.band_rules]]
source_band = "solver"
allowed_target_bands = ["schema"]

[[rule_contracts.band_rules]]
source_band = "derived"
allowed_target_bands = ["schema", "solver"]

[[rule_contracts.band_rules]]
source_band = "pack"
allowed_target_bands = ["schema"]

[[rule_contracts.band_rules]]
source_band = "app"
allowed_target_bands = ["entry", "derived", "dsl"]

[[rule_contracts.band_rules]]
source_band = "ui"
allowed_target_bands = ["entry", "derived", "dsl"]

[[born_crates]]
path = "cad/workspaces/worth-contracts/crates/worth-schema-core"
package = "worth-schema-core"

[[born_crates]]
path = "cad/workspaces/worth-packs/crates/worth-pack-registry"
package = "worth-pack-registry"

[[seed_skeletons]]
path = "cad/workspaces/worth-contracts/crates/worth-schema-core"
package = "worth-schema-core"
lib_rs = "src/lib.rs"
facade_rs = "src/facade.rs"
allowed_entries = [
  "AGENT_CONTEXT.md",
  "Cargo.toml",
  "src",
  "src/facade.rs",
  "src/identity.rs",
  "src/identity_name.rs",
  "src/lib.rs",
  "src/naming.rs",
  "src/tolerance.rs",
  "src/units.rs",
  "tests",
  "tests/facade_boundary.rs",
]

[[seed_skeletons]]
path = "cad/workspaces/worth-packs/crates/worth-pack-registry"
package = "worth-pack-registry"
lib_rs = "src/lib.rs"
facade_rs = "src/facade.rs"
allowed_entries = [
  "AGENT_CONTEXT.md",
  "Cargo.toml",
  "src",
  "src/contribution_descriptor.rs",
  "src/contribution_kinds",
  "src/contribution_kinds/mod.rs",
  "src/facade.rs",
  "src/lib.rs",
  "src/pack_name.rs",
  "src/registration",
  "src/registration/mod.rs",
]

[[subworkspaces]]
path = "cad/workspaces/worth-contracts"
allowed_crate_prefixes = ["worth-schema-"]
member_lane = "crates/*"

[[subworkspaces]]
path = "cad/workspaces/worth-entry"
allowed_crate_prefixes = ["worth-entry-"]
